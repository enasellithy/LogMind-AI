<!DOCTYPE html>
<html>
<head>
    <title>AI Log Monitor</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .card { background: #2d2d2d; border-left: 5px solid #ff4444; padding: 15px; margin-bottom: 10px; border-radius: 4px; animation: fadeIn 0.5s; }
        .suggestion { color: #00ff88; font-weight: bold; margin-top: 10px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h1>🚀 AI Real-time Log Analyzer</h1>
    <div id="logs"></div>

    <script>
        const socket = io('http://localhost:3000'); // عنوان الـ Backend بتاعك
        
        socket.on('new-ai-suggestion', (data) => {
            const logsDiv = document.getElementById('logs');
            const card = `
                <div class="card">
                    <strong>[${data.timestamp}] Service: ${data.service}</strong>
                    <p>❌ Error: ${data.message}</p>
                    <div class="suggestion">💡 AI Suggestion: ${data.suggestion}</div>
                </div>
            `;
            logsDiv.innerHTML = card + logsDiv.innerHTML;
        });
    </script>
</body>
</html>
